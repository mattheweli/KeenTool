name: Stable suite checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y php8.3-cli php8.3-cgi php8.3-sqlite3 sqlite3 lighttpd lighttpd-mod-openssl
      - run: sudo env PATH="$PATH" KT_VALIDATION_RESULTS="$RUNNER_TEMP/keentool-validation.json" python3 suite/tools/check-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keentool-validation.json
          if-no-files-found: warn
